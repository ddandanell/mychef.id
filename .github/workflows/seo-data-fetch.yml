name: seo-data-fetch

# Every 5 days at 00:30 UTC. Pulls 28-day GSC + GA4 data and commits to
# seo-iterations/data/{YYYY-MM-DD}.json. The Claude routine that fires
# at 01:00 UTC on the same days picks up this fresh data automatically.
on:
  schedule:
    - cron: "30 0 */5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-analytics-data

      - name: Fetch GSC + GA4 data
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/seo-loop/fetch_data.py

      - name: Commit data dump
        run: |
          set -e
          git config user.name "mychef-seo-loop[bot]"
          git config user.email "mychef-seo-loop[bot]@users.noreply.github.com"
          git add seo-iterations/data/
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore(seo-loop): fetch GSC + GA4 data for ${today}

[skip ci]
Auto-generated by .github/workflows/seo-data-fetch.yml"
          git push origin HEAD:main
