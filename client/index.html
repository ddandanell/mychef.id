      function gtag(){dataLayer.push(arguments);}

        gtag('consent', 'update', { 'analytics_storage': 'granted' });
        gtag('js', new Date());
        gtag('config', 'G-W0PQH8ZKTF');
      }

      window.enableGoogleAnalytics = function() {

        gtag('js', new Date());

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (per-page values overridden at build time and at runtime by SEO component) -->
    <title>Private Chef in Bali — In-Villa Dining Since 2012 | myCHEF</title>

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Geo Tags (Bali region — no fixed storefront) -->
    <meta name="geo.region" content="ID-BA" />
    <meta name="geo.placename" content="Bali" />
    <meta name="geo.position" content="-8.409518;115.188919" />

    <meta name="theme-color" content="#0a4a3c" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="apple-mobile-web-app-title" content="myCHEF" />

    <meta name="twitter:image" content="https://mychef.id/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Site-wide structured data: Organization + WebSite + ProfessionalService.
         No aggregateRating until verified review system is wired.
         No street address — we are a service-area business.
         Per-page Service / FAQPage schema is injected by the React SEO component and the postbuild step. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mychef.id/#organization",
          "name": "myCHEF Indonesia",
          "alternateName": ["myCHEF", "myCHEF Bali"],
          "url": "https://mychef.id/",
          "logo": { "@type": "ImageObject", "url": "https://mychef.id/logo.png" },
          "foundingDate": "2012",
          "description": "Bali-based private chef booking service operating since 2012. Background-checked chefs for villa dining, events, and recurring household chef arrangements.",
          "telephone": "+62-822-3756-5997",
          "email": "indonesia@mychef.id",
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+62-822-3756-5997",
              "contactType": "Customer service",
              "areaServed": "ID",
              "availableLanguage": ["English", "Indonesian"],
              "contactOption": "TollFree",
              "hoursAvailable": {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
                "opens": "09:00",
                "closes": "22:00"
              }
            },
            {
              "@type": "ContactPoint",
              "telephone": "+62-822-3756-5997",
              "contactType": "Reservations",
              "areaServed": "ID",
              "availableLanguage": ["English", "Indonesian"]
            }
          ],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Jl. Tukad Barito Timur III No.16",
            "addressLocality": "Denpasar",
            "addressRegion": "Bali",
            "postalCode": "80226",
            "addressCountry": "ID"
          },
          "areaServed": { "@type": "AdministrativeArea", "name": "Bali, Indonesia" },
          "sameAs": [
            "https://www.instagram.com/mychef.id",
            "https://www.facebook.com/mychef.indonesia"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://mychef.id/#website",
          "url": "https://mychef.id/",
          "name": "myCHEF Indonesia",
          "publisher": { "@id": "https://mychef.id/#organization" },
          "inLanguage": ["en", "id"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.google.com/search?q=site%3Amychef.id+{search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://mychef.id/#service",
          "name": "myCHEF Indonesia — Private Chef Booking",
          "parentOrganization": { "@id": "https://mychef.id/#organization" },
          "telephone": "+62-822-3756-5997",
          "priceRange": "Rp 800,000 - Rp 1,200,000+ per hour",
          "currenciesAccepted": "IDR",
          "paymentAccepted": ["Cash", "Bank Transfer", "Credit Card"],
          "serviceType": "Private chef and in-villa dining service",
          "areaServed": [
            { "@type": "City", "name": "Canggu" },
            { "@type": "City", "name": "Seminyak" },
            { "@type": "City", "name": "Ubud" },
            { "@type": "City", "name": "Uluwatu" },

            { "@type": "City", "name": "Legian" },
            { "@type": "City", "name": "Tabanan" },
            { "@type": "City", "name": "Tegallalang" },
            { "@type": "City", "name": "Gianyar" },
            { "@type": "City", "name": "Denpasar" }
          ]
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
